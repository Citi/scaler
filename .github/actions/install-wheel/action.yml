name: 'Install Wheel'
description: 'Build The Scaler Wheel And Install It With All Extras'

runs:
  using: "composite"
  steps:
    - name: Build Wheel
      shell: bash
      run: |
        uv pip install --system build
        python -m build --wheel

    - name: Install Wheel
      shell: bash
      run: |
        wheel_file=$(ls dist/*.whl | head -n 1)
        echo "Installing wheel: $wheel_file"
        uv pip install --system "$wheel_file[all]"
